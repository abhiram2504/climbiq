services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-climbiq}
      POSTGRES_USER: ${POSTGRES_USER:-climbiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climbiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://climbiq:climbiq@postgres:5432/climbiq
      VIDEO_STORAGE_PATH: /app/data/videos
      CORS_ORIGINS: http://localhost:5173
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-250}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-600}
      POSE_MODEL_PATH: /app/models/pose_landmarker_full.task
      POSE_MODEL_VERSION: ${POSE_MODEL_VERSION:-pose_landmarker_full_float16_v1}
      POSE_SAMPLING_FPS: ${POSE_SAMPLING_FPS:-8}
      POSE_DETECTION_CONFIDENCE: ${POSE_DETECTION_CONFIDENCE:-0.5}
      POSE_PRESENCE_CONFIDENCE: ${POSE_PRESENCE_CONFIDENCE:-0.5}
      POSE_TRACKING_CONFIDENCE: ${POSE_TRACKING_CONFIDENCE:-0.5}
      POSE_DRAW_VISIBILITY: ${POSE_DRAW_VISIBILITY:-0.35}
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "find /app/alembic -name '._*' -type f -delete &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "0.0.0.0:5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
