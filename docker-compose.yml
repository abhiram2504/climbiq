services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-climbiq}
      POSTGRES_USER: ${POSTGRES_USER:-climbiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climbiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_ROLE: api
      DATABASE_URL: postgresql+psycopg://climbiq:climbiq@postgres:5432/climbiq
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      VIDEO_STORAGE_PATH: /app/data/videos
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SIGNED_URL_SECONDS: ${S3_SIGNED_URL_SECONDS:-900}
      CORS_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: "*"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-development-only-change-before-production}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-250}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-600}
      POSE_MODEL_PATH: /app/models/pose_landmarker_full.task
      POSE_MODEL_VERSION: ${POSE_MODEL_VERSION:-pose_landmarker_full_float16_v1}
      POSE_SAMPLING_FPS: ${POSE_SAMPLING_FPS:-8}
      POSE_DETECTION_CONFIDENCE: ${POSE_DETECTION_CONFIDENCE:-0.5}
      POSE_PRESENCE_CONFIDENCE: ${POSE_PRESENCE_CONFIDENCE:-0.5}
      POSE_TRACKING_CONFIDENCE: ${POSE_TRACKING_CONFIDENCE:-0.5}
      POSE_DRAW_VISIBILITY: ${POSE_DRAW_VISIBILITY:-0.35}
      PROCESSING_MODE: ${PROCESSING_MODE:-local}
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-3600}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "find /app/alembic -name '._*' -type f -delete &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    profiles: ["worker"]
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_ROLE: worker
      DATABASE_URL: postgresql+psycopg://climbiq:climbiq@postgres:5432/climbiq
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      VIDEO_STORAGE_PATH: /app/data/videos
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SIGNED_URL_SECONDS: ${S3_SIGNED_URL_SECONDS:-900}
      POSE_MODEL_PATH: /app/models/pose_landmarker_full.task
      POSE_MODEL_VERSION: ${POSE_MODEL_VERSION:-pose_landmarker_full_float16_v1}
      POSE_SAMPLING_FPS: ${POSE_SAMPLING_FPS:-8}
      POSE_DETECTION_CONFIDENCE: ${POSE_DETECTION_CONFIDENCE:-0.5}
      POSE_PRESENCE_CONFIDENCE: ${POSE_PRESENCE_CONFIDENCE:-0.5}
      POSE_TRACKING_CONFIDENCE: ${POSE_TRACKING_CONFIDENCE:-0.5}
      POSE_DRAW_VISIBILITY: ${POSE_DRAW_VISIBILITY:-0.35}
      PROCESSING_MODE: database
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-3600}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.worker

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "0.0.0.0:5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
